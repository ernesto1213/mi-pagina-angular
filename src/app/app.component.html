<div class="contenedor">
  <h1>¿Quieres ser mi San Valentín? 🦖💕</h1>
  <div class="buttons">
    <button class="yes" (click)="mostrarMensaje()">Sí</button>
    <button class="no" (mouseover)="moverBoton($event)">No</button>
  </div>
  <!-- Usamos el binding de propiedad para mostrar el mensaje -->
  <p [class.hidden]="!mensaje">{{ mensaje }}</p>
</div>
